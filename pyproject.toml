[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mlops_assignment"
version = "0.0.1"
description = "project assignment for mlops module"
authors = [
  { name = "Chin Wei Cong \u0026 Teagan Tham" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
    "pycaret (>=3.3.2,<4.0.0)",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["mlops_assignment"]
include = ["pyproject.toml", "mlops_assignment/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mlops_assignment"]
force-sort-within-sections = true

